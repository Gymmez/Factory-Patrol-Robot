{% extends "base.html" %}

{% block title %}Stream{% endblock %}

{% block head %}
<style>
    body {
        overflow: hidden;
    }
    main {
        max-width: none;
        margin: 0;
        padding: 0;
        height: calc(100vh - 61px);
    }
    main h1 {
        display: none;
    }
    .stream-frame {
        width: 100%;
        height: 100%;
        min-height: 0;
        border: none;
        border-radius: 0;
        object-fit: contain;
    }
</style>
{% endblock %}

{% block content %}
<img class="stream-frame" src="/video_feed" alt="Live robot camera stream">
{% endblock %}
