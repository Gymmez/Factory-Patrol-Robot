{% extends "base.html" %}

{% block title %}Stream{% endblock %}

{% block head %}
<style>
    /* full-screen camera: fill everything under the top bar */
    body {
        overflow: hidden;
    }
    main {
        max-width: none;
        margin: 0;
        padding: 0;
        height: calc(100vh - var(--nav-h));
    }
    .stream-frame {
        width: 100%;
        height: 100%;
        min-height: 0;
        border: none;
        border-radius: 0;
    }
</style>
{% endblock %}

{% block content %}
<img class="stream-frame" src="/video_feed" alt="Live robot camera stream">
{% endblock %}
