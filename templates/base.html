<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Za3tar{% endblock %} | Za3tar</title>
    <style>
        /* ---- colors and sizes used everywhere (change them here) ---- */
        :root {
            color-scheme: dark;
            --bg: #0e1319;
            --panel: #161d26;
            --panel-2: #1c2530;
            --line: #283342;
            --text: #e9edf2;
            --muted: #8e9bab;
            --accent: #f5a524;      /* safety amber */
            --ok: #34c77b;
            --bad: #ef5350;
            --nav-h: 60px;
            font-family: "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            background: var(--bg);
            color: var(--text);
        }

        /* ---- top bar ---- */
        nav {
            position: sticky;
            top: 0;
            z-index: 10;
            height: var(--nav-h);
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 0 24px;
            background: rgba(14, 19, 25, 0.88);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--line);
        }
        nav a {
            padding: 8px 14px;
            border-radius: 6px;
            color: var(--muted);
            text-decoration: none;
            font-size: 15px;
        }
        nav a:hover { color: var(--text); }
        nav a.active {
            color: var(--text);
            background: var(--panel-2);
            box-shadow: inset 0 -2px 0 var(--accent);
        }
        nav a.brand {
            display: flex;
            align-items: center;
            margin-right: 16px;
            padding-left: 0;
            color: var(--text);
            font-size: 19px;
            font-weight: 700;
            background: none;
            box-shadow: none;
        }
        nav a.brand::before {
            content: "";
            width: 8px;
            height: 20px;
            margin-right: 10px;
            border-radius: 2px;
            background: var(--accent);
        }

        /* ---- robot status pill (top right) ---- */
        .robot-status {
            margin-left: auto;
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 6px 14px;
            border: 1px solid var(--line);
            border-radius: 999px;
            background: var(--panel);
            color: var(--muted);
            font-size: 14px;
        }
        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--bad);
        }
        .status-dot.connected { background: var(--ok); }
        .navbar-voltage {
            min-width: 64px;
            text-align: right;
            color: var(--text);
            font-variant-numeric: tabular-nums;
        }

        /* ---- page layout and shared pieces ---- */
        main {
            max-width: 1100px;
            margin: 28px auto;
            padding: 0 20px;
        }
        h1 {
            margin: 0 0 20px;
            font-size: 24px;
            font-weight: 600;
        }
        .muted { color: var(--muted); }
        .stat-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 14px;
        }
        .stat {
            padding: 18px 20px;
            border: 1px solid var(--line);
            border-radius: 10px;
            background: var(--panel);
        }
        .stat h2 {
            margin: 0 0 10px;
            color: var(--muted);
            font-size: 14px;
            font-weight: 500;
        }
        .stat-value {
            font-size: 30px;
            font-weight: 600;
            font-variant-numeric: tabular-nums;
        }
        .offline .stat-value { opacity: 0.35; }
        .stream-frame {
            display: block;
            width: 100%;
            min-height: 480px;
            border: 1px solid var(--line);
            border-radius: 10px;
            background: #05080c;
            object-fit: contain;
        }
        .empty-page {
            min-height: 300px;
            display: grid;
            place-content: center;
            text-align: center;
            gap: 6px;
        }
        .empty-page h1 { margin: 0; }

        @media (max-width: 720px) {
            nav { padding: 0 12px; }
            nav a { padding: 8px 10px; font-size: 14px; }
            #robot-status-text { display: none; }
            .stream-frame { min-height: 240px; }
        }
    </style>
    {% block head %}{% endblock %}
</head>
<body>
    <nav>
        <a href="/" class="brand">Za3tar</a>
        <a href="/" class="{{ 'active' if active_page == 'home' else '' }}">Home</a>
        <a href="/sensors" class="{{ 'active' if active_page == 'sensors' else '' }}">Sensors</a>
        <a href="/stream" class="{{ 'active' if active_page == 'stream' else '' }}">Stream</a>
        <a href="/control" class="{{ 'active' if active_page == 'control' else '' }}">Control</a>
        <div class="robot-status">
            <span class="status-dot" id="robot-status-dot" title="Disconnected"></span>
            <span id="robot-status-text">Disconnected</span>
            <span class="navbar-voltage" id="navbar-voltage">-- V</span>
        </div>
    </nav>

    <main>
        {% block content %}{% endblock %}
    </main>
    <script>
        async function refreshRobotStatus() {
            try {
                const response = await fetch('/api/sensors');
                const data = await response.json();
                const dot = document.getElementById('robot-status-dot');
                const text = document.getElementById('robot-status-text');
                dot.className = data.connected ? 'status-dot connected' : 'status-dot';
                dot.title = data.connected ? 'Connected' : 'Disconnected';
                text.textContent = data.connected ? 'Connected' : 'Disconnected';
                document.getElementById('navbar-voltage').textContent =
                    data.voltage === null ? '-- V' : `${data.voltage} V`;
            } catch (error) {
                document.getElementById('robot-status-dot').className = 'status-dot';
                document.getElementById('robot-status-text').textContent = 'Disconnected';
                document.getElementById('navbar-voltage').textContent = '-- V';
            }
        }
        refreshRobotStatus();
        setInterval(refreshRobotStatus, 2000);
    </script>
</body>
</html>
