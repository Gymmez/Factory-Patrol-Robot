{% extends "base.html" %}

{% block title %}Home{% endblock %}

{% block head %}
<style>
    .home-status {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
        margin-bottom: 12px;
    }
    .home-value {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 14px 16px;
        border: 1px solid #374151;
        border-radius: 8px;
        background: #1f2937;
    }
    .home-value span {
        color: #9ca3af;
    }
    .home-value strong {
        font-size: 20px;
    }
</style>
{% endblock %}

{% block content %}
<h1>Robot Camera</h1>
<div class="home-status">
    <div class="home-value">
        <span>Temperature</span>
        <strong id="home-temperature">-- °C</strong>
    </div>
    <div class="home-value">
        <span>Voltage</span>
        <strong id="home-voltage">-- V</strong>
    </div>
</div>
<img class="stream-frame" src="/video_feed" alt="Live robot camera stream">
<script>
    async function refreshHomeValues() {
        try {
            const response = await fetch('/api/sensors');
            const data = await response.json();
            document.getElementById('home-temperature').textContent =
                data.temperature === null ? '-- °C' : `${data.temperature} °C`;
            document.getElementById('home-voltage').textContent =
                data.voltage === null ? '-- V' : `${data.voltage} V`;
        } catch (error) {
            document.getElementById('home-temperature').textContent = '-- °C';
            document.getElementById('home-voltage').textContent = '-- V';
        }
    }
    refreshHomeValues();
    setInterval(refreshHomeValues, 2000);
</script>
{% endblock %}
