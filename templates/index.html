{% extends "base.html" %}

{% block title %}Home{% endblock %}

{% block head %}
<style>
    /* custom background: put your picture at static/home-bg.jpg
       (if the file is missing, the dark gradient is shown instead) */
    body {
        background-color: var(--bg);
        background-image:
            linear-gradient(rgba(14, 19, 25, 0.70), rgba(14, 19, 25, 0.90)),
            url('/static/home-bg.jpg');
        background-size: cover;
        background-position: center;
        background-attachment: fixed;
    }
    /* semi-transparent panels so the picture shows through a little */
    .stat,
    .stream-frame,
    .db-status {
        background: rgba(22, 29, 38, 0.78);
        backdrop-filter: blur(8px);
    }
    .home-stats {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        margin-bottom: 14px;
    }
    .db-status {
        margin-top: 14px;
        padding: 10px 16px;
        border: 1px solid var(--line);
        border-radius: 10px;
        font-size: 14px;
    }
    .db-status summary {
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 10px;
    }
    .db-status p {
        margin: 10px 0 0;
        color: var(--muted);
        word-break: break-word;
    }
</style>
{% endblock %}

{% block content %}
<h1>Robot camera</h1>

<div class="stat-grid home-stats" id="home-stats">
    <div class="stat">
        <h2>Temperature</h2>
        <div class="stat-value" id="home-temperature">-- °C</div>
    </div>
    <div class="stat">
        <h2>Voltage</h2>
        <div class="stat-value" id="home-voltage">-- V</div>
    </div>
</div>

<img class="stream-frame" src="/video_feed" alt="Live robot camera stream">

<details class="db-status">
    <summary>
        <span class="status-dot {{ 'connected' if db_ok else '' }}"></span>
        {{ 'Database connected' if db_ok else 'Database disconnected' }}
    </summary>
    <p>{{ db_detail }}</p>
</details>

<script>
    async function refreshHomeValues() {
        try {
            const response = await fetch('/api/sensors');
            const data = await response.json();
            document.getElementById('home-temperature').textContent =
                data.temperature === null ? '-- °C' : `${data.temperature} °C`;
            document.getElementById('home-voltage').textContent =
                data.voltage === null ? '-- V' : `${data.voltage} V`;
            // grey out the numbers if the robot stopped sending
            document.getElementById('home-stats').classList.toggle('offline', !data.robot_online);
        } catch (error) {
            document.getElementById('home-temperature').textContent = '-- °C';
            document.getElementById('home-voltage').textContent = '-- V';
        }
    }
    refreshHomeValues();
    setInterval(refreshHomeValues, 2000);
</script>
{% endblock %}
