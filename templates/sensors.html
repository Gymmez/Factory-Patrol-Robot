{% extends "base.html" %}

{% block title %}Sensors{% endblock %}

{% block content %}
<h1>Sensors</h1>
<div class="stat-grid" id="sensor-grid">
    <article class="stat">
        <h2>Battery</h2>
        <div class="stat-value" id="battery">--</div>
    </article>
    <article class="stat">
        <h2>Voltage</h2>
        <div class="stat-value" id="voltage">--</div>
    </article>
    <article class="stat">
        <h2>Temperature</h2>
        <div class="stat-value" id="temperature">--</div>
    </article>
    <article class="stat">
        <h2>Humidity</h2>
        <div class="stat-value" id="humidity">--</div>
    </article>
    <article class="stat">
        <h2>Distance</h2>
        <div class="stat-value" id="distance">--</div>
    </article>
    <article class="stat">
        <h2>Light</h2>
        <div class="stat-value" id="light">--</div>
    </article>
</div>
<p id="sensor-status" class="muted">Waiting for sensor data...</p>

<script>
    async function refreshSensors() {
        try {
            const response = await fetch('/api/sensors');
            const data = await response.json();
            document.getElementById('battery').textContent =
                data.battery === null ? '--' : `${data.battery}%`;
            document.getElementById('voltage').textContent =
                data.voltage === null ? '--' : `${data.voltage} V`;
            document.getElementById('temperature').textContent =
                data.temperature === null ? '--' : `${data.temperature} °C`;
            document.getElementById('humidity').textContent =
                data.humidity === null ? '--' : `${data.humidity}%`;
            document.getElementById('distance').textContent =
                data.distance === null ? '--' : `${data.distance} cm`;
            document.getElementById('light').textContent =
                data.light === null ? '--' : (data.light === 1 ? 'Light' : data.light === 0 ? 'Dark' : 'Invalid');

            // grey out the numbers if the robot stopped sending
            const lastSeen = new Date(data.updated_at).toLocaleTimeString();
            document.getElementById('sensor-grid').classList.toggle('offline', !data.robot_online);
            document.getElementById('sensor-status').textContent = data.robot_online
                ? `Last update: ${lastSeen}`
                : `Robot offline, last seen ${lastSeen}`;
        } catch (error) {
            document.getElementById('sensor-status').textContent =
                'Unable to load sensor data.';
        }
    }
    refreshSensors();
    setInterval(refreshSensors, 1000);
</script>
{% endblock %}
